.chip{background:var(--card);border:2px solid var(--gold);border-radius:999px;padding:5px 14px;font-weight:900}

.bar{height:14px;background:var(--line);border-radius:99px;overflow:hidden;border:1px solid var(--gold)}

.mode .star{margin-left:auto;color:var(--gold);font-size:1.3rem}
.q{flex:1;display:flex;flex-direction:column;justify-content:center;gap:16px}
.prompt{color:var(--mute);font-size:1rem}

.x{background:none;border:0;font-size:1.6rem;color:var(--mute);cursor:pointer;padding:0 6px}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

<script>
/* ===== INHALTE (hier erweitern) =====
   Neue Lektion = neues Objekt in LESSONS. Lektion 4 ist gesperrt angelegt (soon:true):
   einfach Einträge in "words" ergänzen, dann erscheint sie automatisch spielbar.
   Eintrag: { la:"…", de:"Übersetzung", conj:"1sg,2sg,3sg,1pl,2pl,3pl|Imp.Sg,Imp.Pl" }
   - "de" leer lassen = Wort wird in Übersetzungsübungen übersprungen.
   - "conj" nur bei Verben; leere Formen werden nicht abgefragt. */
/* Lektionen 2 und 3 als Textzeilen: "Latein ; Deutsch ; Grammatik"
   Grammatik: m/f/n = Genus | Akk. = Präposition mit Akkusativ | a:/e:/i:Stamm = Verb (a-, e-, i-Konjugation, Formen werden erzeugt)
   c:Formen = Verb mit eigenen Formen (6 Präsensformen|Imperativ Sg.,Pl.) | v:… = nur 1. Pers. Sg. | +Zusatz = z. B. "+m. Dat." */
const CG = { a: ["o","as","at","amus","atis","ant","a","ate"], e: ["eo","es","et","emus","etis","ent","e","ete"], i: ["io","is","it","imus","itis","iunt","i","ite"] };
function parse(t) {
  return t.trim().split("\n").map(l => {
    const [la, de, x = ""] = l.split(" ; "), w = { la: la.trim(), de: de.trim() };
    const [main, extra] = x.trim().split("+");
    if (/^[mfn]$/.test(main)) w.g = main;
    else if (main === "Akk.") w.prep = "Akk.";
    else if (/^[aei]:/.test(main)) { const f = CG[main[0]], s = main.slice(2); w.conj = f.slice(0, 6).map(e => s + e).join(",") + "|" + f.slice(6).map(e => s + e).join(","); }
    else if (main.startsWith("c:")) w.conj = main.slice(2);
    else if (main.startsWith("v:")) w.v = main.slice(2);
    if (extra) w.extra = extra.trim();
    return w;
  });
}

const L3 = `

Circus Maximus ; der Circus Maximus (Rennbahn für Wagenrennen in Rom) ; m

    { la: "orare", de: "bitten", conj: "oro,oras,orat,oramus,oratis,orant|ora,orate" },
    { la: "tandem", de: "endlich" },
    { la: "videre", de: "sehen", conj: "video,vides,videt,videmus,videtis,vident|vide,videte" },
    { la: "populus", de: "das Volk" },
    { la: "victoria", de: "der Sieg" },
    { la: "itaque", de: "deshalb" },
    { la: "huc", de: "hierher" },
    { la: "medicus", de: "der Arzt" },
    { la: "solum", de: "nur" }
  ]
}, { id: "l2", title: "Lektion 2", words: parse(L2) },
   { id: "l3", title: "Lektion 3", words: parse(L3) },
   { id: "l4", title: "Lektion 4", words: [], soon: true }];

/* Konjugations-Felder: Schlüssel p = Präsens, i = Imperativ */
const SLOTS = [["p",0,"1. Person Singular"],["p",1,"2. Person Singular"],["p",2,"3. Person Singular"],
  ["p",3,"1. Person Plural"],["p",4,"2. Person Plural"],["p",5,"3. Person Plural"],
  ["i",0,"Imperativ Singular"],["i",1,"Imperativ Plural"]];
const ROUND_SIZE = 10, MAX_HEARTS = 3, XP_OK = 10, XP_PER_LEVEL = 100, KEY = "latina-v1";
LESSONS.forEach(L => L.words.forEach(w => w.lid = L.id));

const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const forms = w => { if (!w.conj) return null; const [p = "", i = ""] = w.conj.split("|"); return { p: p.split(",").map(s => s.trim()), i: i.split(",").map(s => s.trim()) }; };
const norm = s => s.toLowerCase().replace(/[?!…]/g, "").normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/\s+/g, " ").trim();

/* Bedeutungen: jede einzelne Buchbedeutung (auch ohne Artikel/Klammern) und der volle Eintrag zählen als richtig */
const parts = w => { const s = new Set(); w.de.split(/,\s*|(?<=!)\s+/).concat(w.de).forEach(m => { const c = m.replace(/\s*\([^)]*\)/g, ""); [m, c, c.replace(/^\s*(der|die|das)\s+/i, ""), m.replace(/[()]/g, "")].forEach(v => v && s.add(v)); }); return [...s]; };
const keyset = w => new Set(parts(w).map(norm));
const overlap = (a, b) => [...a].some(x => b.has(x));
const lat = x => [x.la, ...x.la.split(/(?<=!)\s+/)];

/* Grammatische Angaben (Substantiv, Verb, Präposition); sonst leer */
const GEN = { m: "maskulin (m)", f: "feminin (f)", n: "neutrum (n)" };
function gram(w) {
  if (w.g) return "Substantiv, " + GEN[w.g];
  if (w.prep) return "Präposition mit Akkusativ";
  const f = forms(w), v = w.v || (f && f.p[0]);
  return v ? "1. Person Singular: " + v + (w.extra ? " (" + w.extra + ")" : "") : "";
}

/* Fragen-Bauer */
function trQs(ws, dirs) {
  const t = ws.filter(w => w.de);
  if (t.length < 4) return [];
  return shuffle(t).slice(0, ROUND_SIZE).map(w => {
    const k = keyset(w), g = gram(w), d = dirs[Math.floor(Math.random() * dirs.length)];
    const base = { k, kind: "tr", key: w.lid + "|" + w.la };
    if (d === "la") return { ...base, prompt: "Was bedeutet …?", word: w.la, sub: g, answer: w.de, accept: parts(w), pool: t.map(x => ({ t: x.de, k: keyset(x) })) };
    return { ...base, prompt: "Wie heißt auf Latein …?", word: w.de, sub: "", answer: w.la, asub: g,
      accept: t.filter(x => overlap(k, keyset(x))).flatMap(lat), pool: t.map(x => ({ t: x.la, s: gram(x), k: keyset(x) })) };
  });
}
/* Konjugieren: genau ein Verb pro Runde, Antworten nur aus den Formen dieses Verbs */
function conjQs(w) {
  const f = forms(w), own = f.p.concat(f.i).filter(Boolean), qs = [];
  SLOTS.forEach(([k, n, label]) => { if (f[k][n]) qs.push({ kind: "conj", prompt: label + (k === "p" ? " Präsens" : "") + " von …", word: w.la, sub: "", answer: f[k][n], accept: [f[k][n]], pool: own.map(t => ({ t })) }); });
  return shuffle(qs);
}
function withOptions(q) {
  const seen = new Set([q.answer]), wrong = [];
  for (const x of shuffle(q.pool)) {
    if (seen.has(x.t) || (q.k && x.k && overlap(q.k, x.k))) continue;
    seen.add(x.t); wrong.push(x); if (wrong.length === 3) break;
  }
  q.options = shuffle([{ t: q.answer, s: q.asub }, ...wrong]);
  return q;
}
const allWords = () => LESSONS.flatMap(L => L.words);
const MODES = [
  { id: "la-de", icon: "🏺", name: "Latein → Deutsch", desc: "Was bedeutet das Wort?", build: ws => trQs(ws, ["la"]) },
  { id: "de-la", icon: "📜", name: "Deutsch → Latein", desc: "Wie heißt das auf Latein?", build: ws => trQs(ws, ["de"]) },
  { id: "conj", icon: "✒️", name: "Konjugieren", desc: "Ein Verb wählen: 6 Personalformen und Imperativ" },
  { id: "mix", icon: "🎲", name: "Gemischt", desc: "Alle freigeschalteten Lektionen im Wechsel", build: () => trQs(allWords(), ["la", "de"]) }
];
/* Bestwert-Schlüssel: Lektion 1 behält die alten Schlüssel */
const bk = (m, i = save.lesson) => m.id === "mix" ? "mix" : m.id === "conj" ? "conjv:" + LESSONS[i].id : (i === 0 ? m.id : LESSONS[i].id + ":" + m.id);

/* ===== SPEICHER (alter Fortschritt bleibt erhalten) ===== */
let save = { xp: 0, rounds: 0, best: {}, theme: "", lesson: 0, input: false, known: {} };
try { const s = JSON.parse(localStorage.getItem(KEY)); if (s) save = Object.assign(save, s); } catch (e) {}
if (!save.best) save.best = {};
if (!save.known) save.known = {};
delete save.best.pos; /* alter Wortart-Modus entfernt */
if (!LESSONS[save.lesson]) save.lesson = 0;
function persist() { try { localStorage.setItem(KEY, JSON.stringify(save)); } catch (e) {} }

const $ = id => document.getElementById(id);
function show(id) { document.querySelectorAll(".screen").forEach(s => s.classList.toggle("on", s.id === id)); window.scrollTo(0, 0); }
const level = () => Math.floor(save.xp / XP_PER_LEVEL) + 1;
function applyTheme() { if (save.theme) document.documentElement.dataset.theme = save.theme; else delete document.documentElement.dataset.theme; }
const known = L => L.words.filter(w => save.known[w.lid + "|" + w.la]).length;

/* ===== MENÜ ===== */
function renderMenu() {
  const L = LESSONS[save.lesson], n = L.words.length, kn = known(L);
  $("m-xp").textContent = "⭐ " + save.xp + " XP";
  $("m-lvl").textContent = "Level " + level();
  $("m-title").textContent = L.title + (n ? " · " + n + " Vokabeln" : L.soon ? " · Kommt bald raus" : " · noch leer");
  const into = save.xp % XP_PER_LEVEL;
  $("m-bar").style.width = into + "%";
  $("m-sub").textContent = into + " / " + XP_PER_LEVEL + " XP bis Level " + (level() + 1);
  $("m-lsub").textContent = n ? L.title + ": " + kn + " / " + n + " Vokabeln gelernt" : "";
  $("m-lbar").style.width = n ? (kn / n * 100) + "%" : "0";
  $("tabs").innerHTML = "";
  LESSONS.forEach((l, i) => {
    const b = document.createElement("button");
    b.className = "tab" + (i === save.lesson ? " on" : "");
    b.innerHTML = l.title + "<small>" + (l.words.length ? known(l) + " / " + l.words.length + " gelernt" : "🔒 Kommt bald raus") + "</small>";
    b.onclick = () => { save.lesson = i; persist(); renderMenu(); };
    $("tabs").appendChild(b);
  });
  const box = $("modes"); box.innerHTML = "";
  if (!n) {
    box.innerHTML = '<div class="card empty"><div class="big">🔒</div><b>' + L.title + '</b><br>' + (L.soon ? "Kommt bald raus" : "Noch nicht verfügbar.") + '</div>';
  } else MODES.forEach(m => {
    const b = document.createElement("button"), best = save.best[bk(m)], full = m.id === "conj" ? 100 : ROUND_SIZE;
    b.className = "mode";
    b.innerHTML = '<div class="ic">' + m.icon + '</div><div><b>' + m.name + '</b><span>' + m.desc +
      (best != null ? " · Bestwert " + best + (m.id === "conj" ? "%" : "/" + ROUND_SIZE) : "") + '</span></div>' + (best === full ? '<div class="star">★</div>' : "");
    b.onclick = () => startRound(m.id);
    box.appendChild(b);
  });
  show("s-menu");
}
function openVerbs() {
  const box = $("verbs"); box.innerHTML = "";
  LESSONS[save.lesson].words.filter(w => forms(w)).forEach(w => {
    const b = document.createElement("button");
    b.className = "tab";
    b.innerHTML = w.la + "<small>" + forms(w).p[0] + "</small>";
    b.onclick = () => startRound("conj", w);
    box.appendChild(b);
  });
  show("s-verbs");
}

/* ===== QUIZ ===== */
let R = null;
function startRound(modeId, verb) {
  const mode = MODES.find(m => m.id === modeId);
  if (modeId === "conj" && !verb) return openVerbs();
  const qs = (verb ? conjQs(verb) : mode.build(LESSONS[save.lesson].words)).map(withOptions);
  if (qs.length < 4) { alert("Für diese Übung sind noch nicht genug Einträge hinterlegt."); return; }
  R = { mode, verb, bk: bk(mode), qs, i: 0, hearts: MAX_HEARTS, ok: 0, xp: 0, locked: false };
  show("s-quiz"); renderQ();
}
function renderHearts() { $("q-hearts").textContent = "❤️".repeat(R.hearts) + "🖤".repeat(MAX_HEARTS - R.hearts); }
function renderQ() {
  const q = R.qs[R.i], typed = save.input;
  R.locked = false;
  $("q-prompt").textContent = q.prompt;
  $("q-word").textContent = q.word;
  $("q-gram").textContent = q.sub || "";
  $("q-bar").style.width = (R.i / R.qs.length * 100) + "%";
  $("q-fb").className = "fb";
  $("b-sel").className = typed ? "" : "on"; $("b-typ").className = typed ? "on" : "";
  $("q-opts").style.display = typed ? "none" : "grid";
  $("q-typed").style.display = typed ? "flex" : "none";
  const inp = $("q-in"); inp.value = ""; inp.disabled = false; inp.className = ""; $("b-check").disabled = false;
  renderHearts();
  const box = $("q-opts"); box.innerHTML = "";
  q.options.forEach(o => {
    const b = document.createElement("button");
    b.className = "opt"; b.dataset.t = o.t; b.textContent = o.t;
    if (o.s) { const s = document.createElement("small"); s.textContent = o.s; b.appendChild(s); }
    b.onclick = () => answer(b, o.t);
    box.appendChild(b);
  });
  if (typed) inp.focus();
}
function answer(btn, val) {
  if (R.locked) return;
  if (!btn && !val.trim()) return;
  R.locked = true;
  const q = R.qs[R.i], fb = $("q-fb");
  const right = btn ? val === q.answer : q.accept.map(norm).includes(norm(val));
  document.querySelectorAll(".opt").forEach(b => { b.disabled = true; if (b.dataset.t === q.answer) b.classList.add("ok"); });
  if (!btn) { $("q-in").disabled = true; $("b-check").disabled = true; $("q-in").className = right ? "ok" : "bad"; }
  if (right) {
    R.ok++; R.xp += XP_OK; save.xp += XP_OK;
    if (q.key) save.known[q.key] = 1;
    fb.className = "fb show ok"; $("q-msg").textContent = "Recte! Richtig 🎉";
    pop("+" + XP_OK + " XP");
  } else {
    if (btn) btn.classList.add("bad");
    R.hearts--;
    fb.className = "fb show bad"; $("q-msg").textContent = "Falsch. Richtig wäre: " + q.answer;
  }
  renderHearts(); persist();
}
function pop(t) { const d = document.createElement("div"); d.className = "pop"; d.textContent = t; document.body.appendChild(d); setTimeout(() => d.remove(), 900); }
function next() {
  if (R.hearts <= 0) return finish(false);
  R.i++;
  if (R.i >= R.qs.length) return finish(true);
  renderQ();
}
function finish(won) {
  $("q-bar").style.width = "100%";
  if (won) {
    const v = R.mode.id === "conj" ? Math.round(R.ok * 100 / R.qs.length) : R.ok;
    save.rounds++; if ((save.best[R.bk] || 0) < v) save.best[R.bk] = v; persist();
  }
  $("e-icon").textContent = won ? (R.ok === R.qs.length ? "🏆" : "🎉") : "💔";
  $("e-title").textContent = won ? (R.ok === R.qs.length ? "Perfekt!" : "Runde geschafft!") : "Keine Herzen mehr";
  $("e-text").textContent = won ? "Weiter so, du machst Fortschritte!" : "Nicht schlimm – versuch es gleich noch einmal.";
  $("e-xp").textContent = "⭐ +" + R.xp + " XP";
  $("e-ok").textContent = "✅ " + R.ok + " / " + R.qs.length;
  show("s-end");
}
function setInput(v) { if (R.locked) return; save.input = v; persist(); renderQ(); }

/* ===== BUTTONS ===== */
$("b-start").onclick = renderMenu;
$("b-next").onclick = next;
$("b-check").onclick = () => answer(null, $("q-in").value);
$("q-in").onkeydown = e => { if (e.key === "Enter") { R.locked ? next() : answer(null, $("q-in").value); } };
$("b-sel").onclick = () => setInput(false);
$("b-typ").onclick = () => setInput(true);
$("b-quit").onclick = () => { if (confirm("Runde wirklich beenden?")) renderMenu(); };
$("b-vback").onclick = renderMenu;
$("b-again").onclick = () => startRound(R.mode.id, R.verb);
$("b-menu").onclick = renderMenu;
$("b-theme").onclick = () => {
  const d = document.documentElement.dataset.theme === "dark" || (!document.documentElement.dataset.theme && matchMedia("(prefers-color-scheme: dark)").matches);
  save.theme = d ? "light" : "dark"; applyTheme(); persist();
};
$("b-reset").onclick = () => {
  if (confirm("Gesamten Lernfortschritt wirklich löschen?")) { save = { xp: 0, rounds: 0, best: {}, theme: save.theme, lesson: 0, input: false, known: {} }; persist(); renderMenu(); }
};

applyTheme();
show("s-start");
</script>
</body>
</html>
